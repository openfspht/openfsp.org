map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    /health "";
    default "public, max-age=300";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/problems/([a-z0-9-]+)/?$ {
        return 301 /docs/spec/payments-api#$1;
    }

    location ~ ^/fr/problems/([a-z0-9-]+)/?$ {
        return 301 /fr/docs/spec/payments-api#$1;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
