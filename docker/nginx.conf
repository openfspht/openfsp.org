map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    "~^/og/.+\.[0-9a-f]{12}\.png$" "public, max-age=31536000, immutable";
    /health "";
    default "public, max-age=300";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header Cache-Control $cache_control;
    include /etc/nginx/conf.d/security-headers.inc;

    location /api/search-index/ {
        default_type application/json;
        try_files $uri =404;
    }

    location = /monitoring.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 '{"dsn":"${SENTRY_DSN}","environment":"${SENTRY_ENVIRONMENT}","release":"${SENTRY_RELEASE}","tracesSampleRate":"${SENTRY_TRACES_SAMPLE_RATE}","analyticsHost":"${ANALYTICS_HOST}","analyticsWebsiteId":"${ANALYTICS_WEBSITE_ID}"}';
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/problems/([a-z0-9-]+)/?$ {
        return 301 /docs/spec/payments-api#$1;
    }

    location ~ ^/en/problems/([a-z0-9-]+)/?$ {
        return 301 /en/docs/spec/payments-api#$1;
    }

    location ~ ^/fr(?:/([A-Za-z0-9][A-Za-z0-9._~/-]*)?)?$ {
        return 301 /$1$is_args$args;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
