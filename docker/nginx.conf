map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    /health "";
    default "public, max-age=300";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location /api/search-index/ {
        default_type application/json;
        try_files $uri =404;
    }

    location = /monitoring.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"dsn":"${SENTRY_DSN}","environment":"${SENTRY_ENVIRONMENT}","release":"${SENTRY_RELEASE}","tracesSampleRate":"${SENTRY_TRACES_SAMPLE_RATE}"}';
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/problems/([a-z0-9-]+)/?$ {
        return 301 /docs/spec/payments-api#$1;
    }

    location ~ ^/en/problems/([a-z0-9-]+)/?$ {
        return 301 /en/docs/spec/payments-api#$1;
    }

    location ~ ^/fr(?:/(.*))?$ {
        return 301 /$1;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
