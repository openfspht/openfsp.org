pre-commit:
  commands:
    check:
      run: bunx vp check
pre-push:
  commands:
    check:
      run: bun run check && bun run test
commit-msg:
  commands:
    conventional:
      run: >-
        grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+' {1}
