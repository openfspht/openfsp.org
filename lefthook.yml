pre-commit:
  commands:
    check:
      run: bunx vp check
pre-push:
  commands:
    check:
      run: bun run check && bun run test
commit-msg:
  commands:
    conventional:
      run: >-
        test "$(sed '/^#/d;/^[[:space:]]*$/d' {1} | wc -l)" -eq 1 &&
        sed '/^#/d;/^[[:space:]]*$/d' {1} |
        grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+$'
